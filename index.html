<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Expenses">
<title>My Expenses</title>
<style>
:root {
  --blue:#007AFF; --red:#FF3B30; --green:#34C759; --orange:#FF9500;
  --gray:#8E8E93; --light-gray:#E5E5EA; --bg:#F2F2F7; --card:#FFFFFF;
  --text:#000000; --subtext:#6B6B6B; --border:rgba(0,0,0,0.12);
  --tab-h:50px; --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

/* Layout */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px)}

/* Tab Bar */
#tabs{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(248,248,248,0.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:0.5px solid var(--border);
  display:flex;z-index:200
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--gray);font-size:10px;font-weight:500;padding:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}

/* Nav bar */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(248,248,248,0.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:0.5px solid var(--border);
  padding:calc(var(--safe-t) + 12px) 16px 10px;
}
.nav-row{display:flex;align-items:flex-end;justify-content:space-between}
.nav h1{font-size:30px;font-weight:700;letter-spacing:-0.5px;line-height:1}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--blue);font-size:15px;font-weight:600;padding:4px 0;line-height:1.4}
.add-btn{
  width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.add-btn svg{width:20px;height:20px;stroke:white;stroke-width:2.5;fill:none;stroke-linecap:round}

/* Month picker */
.month-row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--bg)}
.m-btn{background:none;border:none;cursor:pointer;color:var(--blue);font-size:22px;padding:4px 8px;line-height:1;font-weight:300}
.m-btn:disabled{color:var(--light-gray)}
.m-label{font-size:16px;font-weight:600;letter-spacing:-0.3px}

/* Total banner */
.total-banner{background:var(--card);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border)}
.total-amount{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.total-meta{font-size:13px;color:var(--subtext)}

/* Sections */
.section{padding:0 16px;margin-top:22px}
.section-title{font-size:12px;font-weight:600;color:var(--subtext);text-transform:uppercase;letter-spacing:0.5px;padding:0 4px 7px}

/* Cards */
.card{background:var(--card);border-radius:13px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:0.5px solid var(--border)}
.row:last-child{border-bottom:none}

/* Expense rows */
.exp-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.exp-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-sub{font-size:12px;color:var(--subtext);margin-top:1px}
.exp-amount{font-size:16px;font-weight:600;white-space:nowrap}
.exp-actions{display:flex;gap:6px;margin-left:6px}
.icon-btn-sm{background:none;border:none;cursor:pointer;font-size:16px;padding:4px;opacity:0.7}

/* Budget bar */
.bud-bar-wrap{padding:8px 14px 10px;border-bottom:0.5px solid var(--border);background:rgba(0,0,0,0.02)}
.bud-bar-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--subtext);margin-bottom:5px}
.bud-track{height:6px;background:var(--light-gray);border-radius:3px;overflow:hidden}
.bud-fill{height:100%;border-radius:3px;transition:width .4s}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 32px;text-align:center;gap:10px}
.empty-ico{font-size:52px;line-height:1}
.empty-h{font-size:19px;font-weight:600}
.empty-p{font-size:14px;color:var(--subtext);line-height:1.5}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;display:flex;align-items:flex-end}
.sheet{
  background:var(--bg);border-radius:20px 20px 0 0;width:100%;
  max-height:92dvh;overflow-y:auto;
  padding-bottom:calc(16px + var(--safe-b));
  animation:slideUp .28s cubic-bezier(.32,.72,0,1)
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:5px;background:var(--border);border-radius:3px;margin:12px auto 4px}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 12px}
.sheet-title{font-size:16px;font-weight:600}
.sh-cancel{background:none;border:none;color:var(--blue);font-size:16px;cursor:pointer}
.sh-save{background:none;border:none;color:var(--blue);font-size:16px;font-weight:700;cursor:pointer}

/* Form */
.f-section{padding:0 16px;margin-bottom:18px}
.f-label{font-size:12px;font-weight:600;color:var(--subtext);text-transform:uppercase;letter-spacing:0.5px;padding:0 4px 7px}
.f-card{background:var(--card);border-radius:13px;overflow:hidden}
.f-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid var(--border)}
.f-row:last-child{border-bottom:none}
.f-lbl{font-size:16px;color:var(--text);flex-shrink:0;min-width:70px}
.f-inp{flex:1;border:none;background:none;font-size:16px;color:var(--text);text-align:right;outline:none;font-family:inherit;min-width:0}
.f-inp::placeholder{color:#C7C7CC}

/* Toggle */
.toggle{-webkit-appearance:none;appearance:none;width:51px;height:31px;background:#E5E5EA;border-radius:31px;cursor:pointer;transition:background .2s;flex-shrink:0;position:relative}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;background:white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.25);transition:left .18s}
.toggle:checked{background:var(--green)}
.toggle:checked::after{left:22px}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:18px}
.cat-opt{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--card);border-radius:13px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,background .1s}
.cat-opt.sel{border-color:var(--blue);background:rgba(0,122,255,0.07)}
.cat-em{font-size:20px;line-height:1}
.cat-nm{font-size:13px;font-weight:500;line-height:1.25;color:var(--text)}

/* Category header in list */
.cat-head{display:flex;align-items:center;gap:8px;padding:0 4px 6px}
.cat-head-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}

/* Summary chart */
.chart-wrap{padding:4px 0 2px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.bar-spacer{flex:1}
.bar-rect{width:100%;border-radius:5px 5px 0 0;min-height:3px}
.bar-lbl{font-size:10px;color:var(--subtext);white-space:nowrap}
.bar-val{font-size:9px;color:var(--subtext);white-space:nowrap}

/* Stat cards */
.stats{display:flex;gap:10px;padding:0 16px;margin-top:16px}
.stat{flex:1;background:var(--card);border-radius:13px;padding:13px 10px;text-align:center}
.stat-v{font-size:19px;font-weight:700;letter-spacing:-0.5px}
.stat-l{font-size:11px;color:var(--subtext);margin-top:2px}

/* Cat summary row */
.csr{padding:10px 14px;border-bottom:0.5px solid var(--border)}
.csr:last-child{border-bottom:none}
.csr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.csr-left{display:flex;align-items:center;gap:9px}
.csr-name{font-size:14px;font-weight:500}
.csr-right{text-align:right}
.csr-amount{font-size:14px;font-weight:600}
.csr-of{font-size:11px;color:var(--subtext)}
.prog{height:7px;background:var(--light-gray);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}

/* Settings */
.set-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-lbl{flex:1;font-size:16px}
.set-inp{border:none;background:rgba(0,0,0,0.04);border-radius:8px;padding:6px 10px;font-size:15px;color:var(--text);text-align:right;width:90px;font-family:inherit;outline:none}
.set-inp:focus{background:rgba(0,122,255,0.08)}

.danger-btn{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px}

/* Recurring badge */
.rec-badge{font-size:10px;color:var(--blue);vertical-align:middle;margin-left:3px}
.rec-copy{font-size:10px;color:var(--gray);vertical-align:middle;margin-left:3px}

/* Scrollbar hide */
#view::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="tabs">
    <button class="tab on" data-t="expenses" onclick="go('expenses')">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Expenses
    </button>
    <button class="tab" data-t="summary" onclick="go('summary')">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-4"/></svg>
      Summary
    </button>
    <button class="tab" data-t="settings" onclick="go('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2h-.5a2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2v-.5a2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2h.5a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.5a1.65 1.65 0 0 0 1.51 1h.09a2 2 0 0 1 2 2v.5a2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>
</div>

<script>
// ─── CATEGORIES ─────────────────────────────────────────────
const CATS = [
  {id:'rent',        name:'Rent/Mortgage',   em:'🏠', color:'#3B82F6', bg:'#EFF6FF'},
  {id:'utilities',   name:'Utilities',       em:'⚡', color:'#D97706', bg:'#FFFBEB'},
  {id:'groceries',   name:'Groceries',       em:'🛒', color:'#16A34A', bg:'#F0FDF4'},
  {id:'transport',   name:'Transport',       em:'🚗', color:'#EA580C', bg:'#FFF7ED'},
  {id:'internet',    name:'Internet & Phone',em:'📶', color:'#0891B2', bg:'#ECFEFF'},
  {id:'insurance',   name:'Insurance',       em:'🛡️', color:'#4F46E5', bg:'#EEF2FF'},
  {id:'health',      name:'Health',          em:'❤️', color:'#DC2626', bg:'#FEF2F2'},
  {id:'education',   name:'Education',       em:'📚', color:'#7C3AED', bg:'#F5F3FF'},
  {id:'dining',      name:'Dining Out',      em:'🍽️', color:'#DB2777', bg:'#FDF2F8'},
  {id:'entertain',   name:'Entertainment',   em:'📺', color:'#0D9488', bg:'#F0FDFA'},
  {id:'clothing',    name:'Clothing',        em:'👕', color:'#78716C', bg:'#FAFAF9'},
  {id:'savings',     name:'Savings',         em:'💵', color:'#059669', bg:'#ECFDF5'},
  {id:'travelling',  name:'Travelling',      em:'✈️', color:'#F59E0B', bg:'#FFFAEB'},
  {id:'other',       name:'Other',           em:'⚙️', color:'#6B7280', bg:'#F9FAFB'},
];
const cat = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];

// ─── STATE ──────────────────────────────────────────────────
let S = {
  tab: 'expenses',
  month: monthNow(),
  expenses: [],
  budgets: {},
};

// ─── STORAGE ────────────────────────────────────────────────
function load() {
  try {
    const e = localStorage.getItem('hexp'); if(e) S.expenses = JSON.parse(e);
    const b = localStorage.getItem('hbud'); if(b) S.budgets  = JSON.parse(b);
  } catch(_){}
}
function saveE() { localStorage.setItem('hexp', JSON.stringify(S.expenses)); }
function saveB() { localStorage.setItem('hbud', JSON.stringify(S.budgets)); }

// ─── HELPERS ────────────────────────────────────────────────
function monthNow() {
  const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(s) {
  const [y,m]=s.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function shortMonth(s) {
  const [y,m]=s.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short'});
}
function shiftMonth(s,d) {
  const [y,m]=s.split('-').map(Number);
  const dt=new Date(y,m-1+d,1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
}
function isCurr(s) { return s===monthNow(); }
function fmtMoney(n) {
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n);
}
function uid() { return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function monthExp(m) { return S.expenses.filter(e=>e.date.startsWith(m)); }
function monthTotal(m) { return monthExp(m).reduce((s,e)=>s+e.amount,0); }
function catTotal(m,cid) { return monthExp(m).filter(e=>e.category===cid).reduce((s,e)=>s+e.amount,0); }

// ─── RECURRING ──────────────────────────────────────────────
function ensureRecurring() {
  const m = S.month;
  const templates = S.expenses.filter(e=>(e.isRecurring || e.isYearly) && !e.recurringSourceId);
  let changed = false;
  for (const t of templates) {
    const tmplM = t.date.slice(0,7);
    if (m <= tmplM) continue;
    
    // Check if it's a yearly expense
    if (t.isYearly) {
      const tmplYear = t.date.slice(0,4);
      const currYear = m.slice(0,4);
      const tmplMonth = t.date.slice(5,7);
      const currMonth = m.slice(5,7);
      
      // Only create yearly expense once per year (same month)
      if (currMonth !== tmplMonth) continue;
      const yearExists = S.expenses.some(e=>e.recurringSourceId===t.id && e.date.slice(0,4)===currYear);
      if (yearExists) continue;
    } else {
      // Regular monthly recurring
      const exists = S.expenses.some(e=>e.recurringSourceId===t.id && e.date.startsWith(m));
      if (exists) continue;
    }
    
    const day = t.date.slice(8,10);
    S.expenses.push({
      id:uid(), title:t.title, amount:t.amount, category:t.category,
      date:`${m}-${day}`, note:t.note, isRecurring:false, isYearly:false, recurringSourceId:t.id
    });
    changed = true;
  }
  if (changed) saveE();
}

// ─── TAB ROUTING ────────────────────────────────────────────
function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  render();
}
function render() {
  const v = document.getElementById('view');
  if (S.tab==='expenses') v.innerHTML = renderExp();
  else if (S.tab==='summary') v.innerHTML = renderSum();
  else v.innerHTML = renderSet();
}
function changeMonth(d) {
  S.month = shiftMonth(S.month,d);
  ensureRecurring();
  render();
}

// ─── EXPENSES TAB ───────────────────────────────────────────
function renderExp() {
  const exps = monthExp(S.month);
  const total = exps.reduce((s,e)=>s+e.amount,0);

  // Group by category
  const grp={};
  for (const e of exps) { (grp[e.category]=grp[e.category]||[]).push(e); }
  const cids = Object.keys(grp).sort((a,b)=>cat(a).name.localeCompare(cat(b).name));

  let h = `
  <div class="nav">
    <div class="nav-row">
      <h1>My Expenses</h1>
      <button class="add-btn" onclick="openAdd()">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
      </button>
    </div>
  </div>
  <div class="month-row">
    <button class="m-btn" onclick="changeMonth(-1)">‹</button>
    <span class="m-label">${monthLabel(S.month)}</span>
    <button class="m-btn" onclick="changeMonth(1)" ${isCurr(S.month)?'disabled':''}>›</button>
  </div>
  <div class="total-banner">
    <div>
      <div style="font-size:12px;color:var(--subtext)">Total this month</div>
      <div class="total-amount">${fmtMoney(total)}</div>
    </div>
    <div class="total-meta">${exps.length} expense${exps.length!==1?'s':''}</div>
  </div>`;

  if (!exps.length) {
    h += `<div class="empty">
      <div class="empty-ico">🧾</div>
      <div class="empty-h">No expenses yet</div>
      <div class="empty-p">Tap + to add your first expense for ${monthLabel(S.month)}</div>
    </div>`;
    return h;
  }

  for (const cid of cids) {
    const c = cat(cid);
    const items = grp[cid].sort((a,b)=>b.date.localeCompare(a.date));
    const ctotal = items.reduce((s,e)=>s+e.amount,0);
    const bud = S.budgets[cid];

    h += `<div class="section">
      <div class="section-title">
        <div class="cat-head">
          <div class="cat-head-ico" style="background:${c.bg}">${c.em}</div>
          <span style="font-size:13px;font-weight:600;color:var(--subtext);text-transform:uppercase;letter-spacing:.4px">${c.name}</span>
          <span style="margin-left:auto;font-size:13px;font-weight:600;color:var(--subtext)">${fmtMoney(ctotal)}</span>
        </div>
      </div>
      <div class="card">`;

    if (bud) {
      const ratio = Math.min(ctotal/bud,1);
      const over = ctotal>bud;
      const near = !over && ratio>=0.85;
      const barClr = over?'#FF3B30':near?'#FF9500':'#34C759';
      h += `<div class="bud-bar-wrap">
        <div class="bud-bar-labels">
          <span>Budget ${fmtMoney(bud)}</span>
          <span style="color:${over?'#FF3B30':near?'#FF9500':'inherit'}">
            ${over?'⚠️ Over by '+fmtMoney(ctotal-bud):fmtMoney(bud-ctotal)+' left ('+Math.round(ratio*100)+'%)'}
          </span>
        </div>
        <div class="bud-track"><div class="bud-fill" style="width:${ratio*100}%;background:${barClr}"></div></div>
      </div>`;
    }

    for (const e of items) {
      const recIcon = e.isRecurring?'<span class="rec-badge">🔁</span>':e.isYearly?'<span class="rec-badge" title="Yearly">📅</span>':e.recurringSourceId?'<span class="rec-copy" title="Auto-recurring">↩</span>':'';
      h += `<div class="exp-row">
        <div class="exp-icon" style="background:${c.bg}">${c.em}</div>
        <div class="exp-info">
          <div class="exp-title">${esc(e.title)}${recIcon}</div>
          <div class="exp-sub">${e.date}${e.note?' · '+esc(e.note):''}</div>
        </div>
        <div class="exp-amount">${fmtMoney(e.amount)}</div>
        <div class="exp-actions">
          <button class="icon-btn-sm" onclick="openEdit('${e.id}')">✏️</button>
          <button class="icon-btn-sm" onclick="delExp('${e.id}')">🗑️</button>
        </div>
      </div>`;
    }

    h += `</div></div>`;
  }
  return h;
}

// ─── SUMMARY TAB ────────────────────────────────────────────
function renderSum() {
  const exps = monthExp(S.month);
  const total = exps.reduce((s,e)=>s+e.amount,0);
  const totalBud = Object.values(S.budgets).reduce((s,v)=>s+v,0);

  // 6 months
  const months6 = [];
  for (let i=5;i>=0;i--) {
    const ms = shiftMonth(S.month,-i);
    months6.push({ms, total:monthTotal(ms)});
  }
  const maxT = Math.max(...months6.map(m=>m.total),1);

  // Category totals
  const crows = CATS.map(c=>({
    c, spent:catTotal(S.month,c.id), bud:S.budgets[c.id]
  })).filter(x=>x.spent>0).sort((a,b)=>b.spent-a.spent);

  let h = `
  <div class="nav"><h1>Summary</h1></div>
  <div class="month-row">
    <button class="m-btn" onclick="changeMonth(-1)">‹</button>
    <span class="m-label">${monthLabel(S.month)}</span>
    <button class="m-btn" onclick="changeMonth(1)" ${isCurr(S.month)?'disabled':''}>›</button>
  </div>
  <div style="text-align:center;padding:18px 16px 8px">
    <div style="font-size:12px;color:var(--subtext);letter-spacing:.3px">TOTAL SPENT</div>
    <div style="font-size:42px;font-weight:800;letter-spacing:-1.5px;margin-top:2px">${fmtMoney(total)}</div>
    <div style="font-size:13px;color:var(--subtext)">${exps.length} expense${exps.length!==1?'s':''}</div>
  </div>`;

  // Budget overview
  if (totalBud>0) {
    const r = Math.min(total/totalBud,1);
    const over = total>totalBud;
    const near = !over && r>=0.85;
    const bc = over?'#FF3B30':near?'#FF9500':'#34C759';
    h += `
    <div class="stats">
      <div class="stat">
        <div class="stat-v">${fmtMoney(totalBud)}</div>
        <div class="stat-l">Budget</div>
      </div>
      <div class="stat">
        <div class="stat-v" style="color:${over?'#FF3B30':'#34C759'}">${fmtMoney(Math.abs(totalBud-total))}</div>
        <div class="stat-l" style="color:${over?'#FF3B30':'inherit'}">${over?'Over Budget':'Remaining'}</div>
      </div>
      <div class="stat">
        <div class="stat-v" style="color:${over?'#FF3B30':near?'#FF9500':'inherit'}">${Math.round(r*100)}%</div>
        <div class="stat-l">Used</div>
      </div>
    </div>
    <div class="section" style="margin-top:12px">
      <div class="card" style="padding:12px 14px">
        <div class="bud-track" style="height:10px">
          <div class="bud-fill" style="width:${r*100}%;background:${bc};height:10px"></div>
        </div>
      </div>
    </div>`;
  }

  // Bar chart
  h += `<div class="section"><div class="section-title">Last 6 Months</div>
  <div class="card" style="padding:16px 12px 12px">
  <div class="bars">`;
  for (const {ms,total:t} of months6) {
    const pct = (t/maxT)*100;
    const isCur = ms===S.month;
    h += `<div class="bar-col">
      <div class="bar-spacer"></div>
      ${t>0?`<div class="bar-val">${fmtMoney(t).replace(/\.00$/,'').replace('$','$')}</div>`:''}
      <div class="bar-rect" style="height:${Math.max(pct,t>0?3:0)}%;background:${isCur?'#007AFF':'#BFD7FF'}"></div>
      <div class="bar-lbl">${shortMonth(ms)}</div>
    </div>`;
  }
  h += `</div></div></div>`;

  // Category breakdown
  if (crows.length) {
    h += `<div class="section"><div class="section-title">By Category</div><div class="card">`;
    for (const {c,spent,bud} of crows) {
      const ratio = bud ? Math.min(spent/bud,1) : total>0?spent/total:0;
      const over  = bud && spent>bud;
      const near  = bud && !over && spent/bud>=0.85;
      const bc    = bud ? (over?'#FF3B30':near?'#FF9500':c.color) : c.color;
      h += `<div class="csr">
        <div class="csr-top">
          <div class="csr-left">
            <div class="cat-head-ico" style="background:${c.bg};width:30px;height:30px;border-radius:8px">${c.em}</div>
            <span class="csr-name">${c.name}</span>
          </div>
          <div class="csr-right">
            <div class="csr-amount">${fmtMoney(spent)}</div>
            <div class="csr-of" style="color:${over?'#FF3B30':'var(--subtext)'}">
              ${bud?'of '+fmtMoney(bud):Math.round(spent/total*100)+'%'}
            </div>
          </div>
        </div>
        <div class="prog"><div class="prog-fill" style="width:${ratio*100}%;background:${bc}"></div></div>
      </div>`;
    }
    h += `</div></div>`;
  }

  if (!exps.length) {
    h += `<div class="empty">
      <div class="empty-ico">📊</div>
      <div class="empty-h">No data yet</div>
      <div class="empty-p">Add some expenses to see your summary</div>
    </div>`;
  }
  return h;
}

// ─── SETTINGS TAB ───────────────────────────────────────────
function renderSet() {
  const templates = S.expenses.filter(e=>(e.isRecurring || e.isYearly)&&!e.recurringSourceId);

  let h = `<div class="nav"><h1>Settings</h1></div>`;

  // Budget limits
  h += `<div class="section" style="margin-top:20px">
    <div class="section-title">Monthly Budgets</div>
    <div class="card">`;
  for (const c of CATS) {
    const val = S.budgets[c.id]||'';
    h += `<div class="set-row">
      <span style="font-size:18px">${c.em}</span>
      <span class="set-lbl">${c.name}</span>
      <input type="number" inputmode="decimal" class="set-inp" placeholder="No limit"
        value="${esc(String(val))}" onchange="setBudget('${c.id}',this.value)">
    </div>`;
  }
  h += `</div></div>`;

  // Recurring
  h += `<div class="section">
    <div class="section-title">Recurring Expenses (${templates.length})</div>
    <div class="card">`;
  if (!templates.length) {
    h += `<div class="row" style="color:var(--subtext);font-size:14px">No recurring expenses yet. Toggle "Recurring" when adding an expense.</div>`;
  } else {
    for (const t of templates) {
      const c = cat(t.category);
      const freq = t.isYearly ? 'year' : 'month';
      h += `<div class="row" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="cat-head-ico" style="background:${c.bg}">${c.em}</div>
          <div>
            <div style="font-size:15px;font-weight:500">${esc(t.title)}</div>
            <div style="font-size:12px;color:var(--subtext)">${c.name} · ${fmtMoney(t.amount)}/${freq}</div>
          </div>
        </div>
        <button onclick="stopRec('${t.id}')"
          style="background:#FEF2F2;color:#DC2626;border:none;border-radius:9px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer">
          Stop
        </button>
      </div>`;
    }
  }
  h += `</div></div>`;

  // Stats & danger
  h += `<div class="section">
    <div class="section-title">Data</div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span style="font-size:15px">Total expenses</span>
        <span style="color:var(--subtext)">${S.expenses.length}</span>
      </div>
      <div class="row" style="justify-content:space-between">
        <span style="font-size:15px">Budgets set</span>
        <span style="color:var(--subtext)">${Object.keys(S.budgets).length}</span>
      </div>
      <div class="row">
        <button class="danger-btn" onclick="deleteAll()">🗑️ Delete All Data</button>
      </div>
    </div>
  </div>
  <div style="text-align:center;padding:24px 16px;color:var(--subtext);font-size:13px">
    My House Expenses • v2.1<br>
    <span style="font-size:11px">Tap Share → Add to Home Screen</span>
  </div>`;

  return h;
}

// ─── MODAL ──────────────────────────────────────────────────
let _editId = null;
let _selCat = 'other';

function openAdd() {
  _editId = null;
  _selCat = 'other';
  const today = new Date().toISOString().slice(0,10);
  // Default date to first of selected month if not current month
  let defDate = today;
  if (!isCurr(S.month)) {
    defDate = S.month + '-01';
  }
  showModal({title:'',amount:'',category:'other',date:defDate,note:'',isRecurring:false,isYearly:false});
}

function openEdit(id) {
  _editId = id;
  const e = S.expenses.find(x=>x.id===id);
  if (!e) return;
  _selCat = e.category;
  showModal({...e, amount:String(e.amount)});
}

function showModal(d) {
  _selCat = d.category||'other';
  const isEdit = !!_editId;
  const isCopy = !!d.recurringSourceId;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modal';
  overlay.onclick = e => { if(e.target===overlay) closeModal(); };

  overlay.innerHTML = `
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button class="sh-cancel" onclick="closeModal()">Cancel</button>
      <span class="sheet-title">${isEdit?'Edit Expense':'New Expense'}</span>
      <button class="sh-save" onclick="saveExp()">${isEdit?'Save':'Add'}</button>
    </div>

    <div class="f-section">
      <div class="f-label">Details</div>
      <div class="f-card">
        <div class="f-row">
          <label class="f-lbl" for="mi-t">Title</label>
          <input id="mi-t" class="f-inp" placeholder="e.g. Electricity" value="${esc(d.title)}" autocomplete="off">
        </div>
        <div class="f-row">
          <label class="f-lbl" for="mi-a">Amount</label>
          <input id="mi-a" class="f-inp" type="number" inputmode="decimal" placeholder="0.00" value="${d.amount}" autocomplete="off">
        </div>
        <div class="f-row">
          <label class="f-lbl" for="mi-d">Date</label>
          <input id="mi-d" class="f-inp" type="date" value="${d.date}">
        </div>
        <div class="f-row">
          <label class="f-lbl" for="mi-n">Note</label>
          <input id="mi-n" class="f-inp" placeholder="Optional" value="${esc(d.note||'')}" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="f-section">
      <div class="f-label">Category</div>
      <div id="cat-grid" class="cat-grid">${buildCatGrid()}</div>
    </div>

    <div class="f-section">
      <div class="f-card" ${isCopy?'style="opacity:.5;pointer-events:none"':''}>
        <div class="f-row">
          <div style="flex:1">
            <div style="font-size:16px;font-weight:500">Recurring Monthly 🔁</div>
            <div style="font-size:12px;color:var(--subtext);margin-top:2px">Auto-add to every future month</div>
          </div>
          <input type="checkbox" class="toggle" id="mi-r" ${d.isRecurring?'checked':''} ${isCopy?'disabled':''}>
        </div>
      </div>
      <div class="f-card" style="margin-top:12px;${isCopy?'opacity:.5;pointer-events:none;':''}">
        <div class="f-row">
          <div style="flex:1">
            <div style="font-size:16px;font-weight:500">Recurring Yearly 📅</div>
            <div style="font-size:12px;color:var(--subtext);margin-top:2px">Auto-add same month every year</div>
          </div>
          <input type="checkbox" class="toggle" id="mi-y" ${d.isYearly?'checked':''} ${isCopy?'disabled':''}>
        </div>
      </div>
      ${isCopy?'<div style="font-size:12px;color:var(--subtext);margin-top:6px;padding:0 4px">Auto-generated copy — edit the original to change the template.</div>':''}
    </div>
  </div>`;

  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('mi-t')?.focus(),350);
}

function buildCatGrid() {
  return CATS.map(c=>`
    <div class="cat-opt${c.id===_selCat?' sel':''}" onclick="pickCat('${c.id}')">
      <span class="cat-em">${c.em}</span>
      <span class="cat-nm">${c.name}</span>
    </div>`).join('');
}

function pickCat(id) {
  _selCat = id;
  document.getElementById('cat-grid').innerHTML = buildCatGrid();
}

function saveExp() {
  const title  = document.getElementById('mi-t').value.trim();
  const amount = parseFloat(document.getElementById('mi-a').value);
  const date   = document.getElementById('mi-d').value;
  const note   = document.getElementById('mi-n').value.trim();
  const isRec  = document.getElementById('mi-r').checked;
  const isYearly = document.getElementById('mi-y').checked;

  if (!title||isNaN(amount)||amount<=0||!date) {
    alert('Please fill in Title, Amount and Date.'); return;
  }

  if (_editId) {
    const e = S.expenses.find(x=>x.id===_editId);
    if (e) Object.assign(e,{title,amount,date,note,isRecurring:isRec,isYearly:isYearly,category:_selCat});
  } else {
    S.expenses.push({id:uid(),title,amount,category:_selCat,date,note,isRecurring:isRec,isYearly:isYearly,recurringSourceId:null});
  }

  saveE(); closeModal(); render();
}

function closeModal() { document.getElementById('modal')?.remove(); }

function delExp(id) {
  if (!confirm('Delete this expense?')) return;
  S.expenses = S.expenses.filter(e=>e.id!==id);
  saveE(); render();
}

function stopRec(id) {
  if (!confirm('Stop this expense from repeating?')) return;
  const e = S.expenses.find(x=>x.id===id);
  if (e) { e.isRecurring=false; e.isYearly=false; saveE(); render(); }
}

function setBudget(cid,val) {
  const n = parseFloat(val);
  if (isNaN(n)||n<=0) delete S.budgets[cid];
  else S.budgets[cid]=n;
  saveB();
}

function deleteAll() {
  if (!confirm('Delete ALL data? This cannot be undone.')) return;
  S.expenses=[]; S.budgets={};
  saveE(); saveB(); render();
}

// ─── BOOT ───────────────────────────────────────────────────
load();
ensureRecurring();
render();
</script>
</body>
</html>
